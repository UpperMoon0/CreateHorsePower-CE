name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew
      # Root build builds every included platform subproject
      # (neoforge-1.21.1 and forge-1.20.1 share sources from /common).
      - run: ./gradlew clean build

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew
      # Aggregate verification: shared source + resource parity checks, both
      # platform builds, and the shared tests compiled/run against every target.
      - run: ./gradlew verify

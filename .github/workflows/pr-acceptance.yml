# Pull-request acceptance runs only on disposable GitHub-hosted runners.
# Production main/release CI remains owned by NsTut-CICD Jenkins. No secrets,
# private workers, deployment, or CurseForge publishing are available here.
name: Horse Power CE PR acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chp-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Shared parity and CI contracts
        run: python3 tools/jenkins_horsepower.py verify

  acceptance:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [forge, neoforge]
        suite: [vanilla, icy, bionics]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Forge Bionics toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record JDK 17 location
        shell: bash
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install primary JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run full dedicated-server acceptance (including real restart probes)
        shell: bash
        env:
          MATRIX_SUITE: ${{ matrix.suite }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: python3 tools/jenkins_horsepower.py "$MATRIX_SUITE-$MATRIX_TARGET"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chp-failure-${{ matrix.suite }}-${{ matrix.target }}
          path: |
            */run/logs/**
            */build/restart-evidence/**
            */build/bionics-restart-evidence/**
            */build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  release-contract:
    if: github.event_name == 'pull_request'
    needs: [contracts, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate production release bundle without publishing
        run: python3 tools/jenkins_horsepower.py package
      - name: Record verified production bundle
        uses: actions/upload-artifact@v4
        with:
          name: chp-pr-verified-bundle
          path: release-output/*
          retention-days: 7
          if-no-files-found: error

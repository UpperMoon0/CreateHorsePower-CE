plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Shared mod metadata lives in the root gradle.properties
['mod_id', 'mod_name', 'mod_license', 'mod_group_id', 'mod_authors', 'mod_credits', 'mod_description'].each {
    ext[it] = rootProject.property(it)
}

// Semantic mod version lives at the root; artifacts are "<mc>-<mod_version>"
version = "${project.minecraft_version}-${rootProject.mod_version}"
ext.mod_version = version
group = mod_group_id

base {
    archivesName = "${mod_id}-ce"
}

// Mojang ships Java 17 to end users in 1.20.1, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Shared multi-loader sources (single source of truth)
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
        }
    }
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Dev runs use class/resource directories, so the release jar's
            // MixinConfigs manifest is not scanned. Mixin 0.8.5 consumes its
            // --mixin.config CLI option; it does not read a mixin.config JVM property.
            args '--mixin.config', 'createhorsepower.compat.mixins.json'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (providers.gradleProperty('chpRestartPhase').isPresent()) {
                workingDirectory project.file(providers.gradleProperty('chpRestartDirectory').get())
                property 'createhorsepower.restart.phase', providers.gradleProperty('chpRestartPhase').get()
                property 'createhorsepower.restart.dir', project.file(providers.gradleProperty('chpRestartDirectory').get()).absolutePath
                property 'createhorsepower.icyExpected', providers.gradleProperty('icyCompatibilityTest').getOrElse('false')
                if (providers.gradleProperty('bionicsCompatibilityTest').getOrElse('false').toBoolean()) {
                    property 'createhorsepower.bionicsExpected', 'true'
                    property 'createhorsepower.bionicsRestartPhase', providers.gradleProperty('chpRestartPhase').get()
                }
            }
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('bionicsCompatibilityTest').getOrElse('false').toBoolean()
                    ? 'createhorsepower_bionics'
                    : (providers.gradleProperty('icyCompatibilityTest').getOrElse('false').toBoolean() ? 'createhorsepower_icy' : "${mod_id},minecraft,createhorsepower_icy")
            property 'createhorsepower.bionicsExpected', providers.gradleProperty('bionicsCompatibilityTest').getOrElse('false')
            property 'createhorsepower.icyExpected', providers.gradleProperty('icyCompatibilityTest').getOrElse('false')
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--server', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', rootProject.file('common/src/main/resources')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        project.copy {
            from rootProject.file('common/src/gametest/resources/gameteststructures')
            into project.file('run/gameteststructures')
        }
    }
}

repositories {
    // CI builds the pinned upstream Forge 2.0.0 source: that upstream
    // version has no published release jar. Never silently substitute a jar.
    flatDir { dirs project.file('build/bionics-runtime') }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    if (providers.gradleProperty('bionicsCompatibilityTest').getOrElse('false').toBoolean()) {
        def jar = project.file('build/bionics-runtime/createbionics-2.0.0.jar')
        // The selected Forge runtime task will fail dependency resolution if this
        // exact jar is missing. Other-loader Gradle configuration must remain possible.
        runtimeOnly(fg.deobf("bionics.local:createbionics:2.0.0"))
    }
    // Opt-in, exact released artifacts: never packaged with CHP or required by users.
    if (providers.gradleProperty('icyCompatibilityTest').getOrElse('false').toBoolean()) {
        runtimeOnly(fg.deobf("maven.modrinth:icys-better-horses:kXpI9qsc"))
        runtimeOnly(fg.deobf("maven.modrinth:geckolib:aC5KMoNg"))
    }

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    // compile against the JEI API but do not include it at runtime
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // Jade is optional for users, but installed in the dev client for HUD integration testing.
    compileOnly(fg.deobf("maven.modrinth:jade:${jade_version}"))
    runtimeOnly(fg.deobf("maven.modrinth:jade:${jade_version}"))

    // TFC is optional for users, but installed in dev runs for compatibility testing.
    // CurseMaven does not publish transitive metadata, so include TFC's required Patchouli dependency explicitly.
    runtimeOnly(fg.deobf("curse.maven:terrafirmacraft-302973:8762332")) // TFC 1.20.1-3.2.25
    runtimeOnly(fg.deobf("vazkii.patchouli:Patchouli:1.20.1-81-FORGE"))

    // Shared behavioral tests run on every target
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    // Datagen bookkeeping is not a runtime resource or release artifact.
    exclude '.cache/**'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description, mod_credits: mod_credits,
            mod_homepage: rootProject.mod_homepage, mod_issue_tracker: rootProject.mod_issue_tracker
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs'            : 'createhorsepower.compat.mixins.json',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="createhorsepower-mod-icon.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[6.0.8,)"
    ordering="NONE"
    side="BOTH"

# Optional integration is supported from the minimum known API version onward.
# Later releases are allowed; compatibility is verified independently in CI.
[[dependencies.${mod_id}]]
    modId="icys_better_horses"
    mandatory=false
    versionRange="[2.1.7,)"
    ordering="NONE"
    side="BOTH"
